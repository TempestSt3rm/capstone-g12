[platformio]
default_envs = tx_esp32u

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags = -D CONFIG_ESP_WIFI_CSI_ENABLED=1

[env:tx_esp32u]
board = esp32dev
build_src_filter = +<transmitter.cpp>

[env:rx1_pico]
board = pico32
build_flags = ${env.build_flags} -D RECEIVER_ID=1
build_src_filter = +<receiver.cpp>

[env:rx2_wroom]
board = freenove_esp32_s3_wroom
build_flags = ${env.build_flags} -D RECEIVER_ID=2
build_src_filter = +<receiver.cpp>

