[platformio]
default_envs = rx_esp32u

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags = -D CONFIG_ESP_WIFI_CSI_ENABLED=1

[env:tx_pico]
board = pico32
build_src_filter = +<transmitter.cpp>

[env:tx_wroom]
board = freenove_esp32_s3_wroom
build_src_filter = +<transmitter.cpp>

[env:rx_pico]
board = pico32
build_src_filter = +<receiver.cpp>

[env:rx_wroom]
board = freenove_esp32_s3_wroom
build_src_filter = +<receiver.cpp>

; ESP32-U uses the generic ESP32 Dev Module board definition.
[env:tx_esp32u]
board = esp32dev
build_src_filter = +<transmitter.cpp>

[env:rx_esp32u]
board = esp32dev
build_src_filter = +<receiver.cpp>
