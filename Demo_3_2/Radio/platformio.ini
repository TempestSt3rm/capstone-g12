[platformio]
default_envs = receiver

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags = -D CONFIG_ESP_WIFI_CSI_ENABLED=1

[env:receiver]
; ESP32-PICO-KIT-1 V1.0 (ESP32-PICO-V3, 4 MB flash)
board = pico32
build_src_filter = +<receiver.cpp> +<components/> -<components/TransmitterApp.cpp>

[env:transmitter]
board = freenove_esp32_s3_wroom
build_src_filter = +<transmitter.cpp> +<components/RadioLink.cpp> +<components/Protocol.cpp> +<components/SerialCommands.cpp> +<components/TransmitterApp.cpp>
